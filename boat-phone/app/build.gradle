// VARUNA Boat Link: the phone on the boat. Pixhawk over USB OTG <-> Wi-Fi
// (TCP 5760, like the old ESP32 bridge), the phone's GPS into the Pixhawk
// (GPS_INPUT), and the phone's camera as MJPEG on port 8080. 2.4.0: the trained AI
// captain (assets/captain.bin, copied from boat-r4/ai/out at every build), watch only or full control.
// Build: gradlew assembleDebug  ->  app/build/outputs/apk/debug/app-debug.apk
plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.varuna.boatlink'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.varuna.boatlink'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '2.4.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The newest exported captain (boat-r4/ai/export.py -> out/captain.bin) goes into the app at every build.
def captainBin = file("../../boat-r4/ai/out/captain.bin")
tasks.register('copyCaptain', Copy) {
    from(captainBin)
    into("src/main/assets")
    onlyIf { captainBin.exists() }
}
preBuild.dependsOn('copyCaptain')
