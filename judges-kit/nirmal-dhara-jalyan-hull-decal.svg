<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 600" width="2400" height="600">
  <title>Nirmal Dhara Jalyan - hull decal</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&amp;display=swap'); .n { font-family: Rajdhani, 'Nirmala UI', 'Segoe UI', Arial, sans-serif; font-weight: 700; } .m { font-family: Rajdhani, 'Nirmala UI', 'Segoe UI', Arial, sans-serif; font-weight: 600; }</style>
  <rect x="6" y="6" width="2388" height="588" rx="64" fill="#ffffff" stroke="#081f3b" stroke-width="8"/>
  <circle cx="300" cy="300" r="250" fill="#081f3b"/>
  <svg x="60" y="60" width="480" height="480" viewBox="160 160 680 680">
    
  <defs>
    <clipPath id="dc-in"><circle cx="500" cy="500" r="330"/></clipPath>
    <clipPath id="dc-hull"><path d="M300 540 L640 540 L640 600 Q640 622 618 622 L322 622 Q300 622 300 600 Z"/></clipPath>
    <linearGradient id="dc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#174d85"/><stop offset="1" stop-color="#0b2c55"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#dc-in)">
    <rect x="160" y="160" width="680" height="680" fill="url(#dc-sky)"/>
    <!-- drone and its camera beam onto the bottle -->
    <polygon points="500,318 718,614 790,614" fill="#ffffff" opacity="0.13"/>
    <g fill="#ffffff">
      <rect x="470" y="292" width="60" height="22" rx="10"/>
      <rect x="428" y="294" width="144" height="7" rx="3.5"/>
      <rect x="436" y="278" width="10" height="20" rx="3"/>
      <rect x="554" y="278" width="10" height="20" rx="3"/>
      <ellipse cx="441" cy="276" rx="38" ry="6"/>
      <ellipse cx="559" cy="276" rx="38" ry="6"/>
      <circle cx="500" cy="320" r="7" fill="#ff9933"/>
    </g>
    <g transform="translate(-50 0)">
    <!-- boat: white hull with saffron and green bands, like the real one -->
    <path d="M300 540 L640 540 L640 600 Q640 622 618 622 L322 622 Q300 622 300 600 Z" fill="#ffffff"/>
    <g clip-path="url(#dc-hull)">
      <rect x="300" y="540" width="340" height="18" fill="#ff9933"/>
      <rect x="300" y="604" width="340" height="18" fill="#138808"/>
    </g>
    <rect x="330" y="500" width="130" height="40" rx="9" fill="#d9e6f2"/>
    <rect x="346" y="510" width="26" height="14" rx="3" fill="#081f3b"/>
    <rect x="380" y="510" width="26" height="14" rx="3" fill="#081f3b"/>
    <line x1="430" y1="500" x2="430" y2="430" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="430" cy="424" rx="24" ry="9" fill="#ffffff"/>
    <line x1="480" y1="540" x2="490" y2="452" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="490" cy="450" r="6" fill="#ff9933"/>
    <!-- conveyor ramp at the bow -->
    <line x1="642" y1="548" x2="735" y2="640" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <line x1="655.0" y1="572.1" x2="666.2" y2="560.7" stroke="#081f3b" stroke-width="4" stroke-linecap="round"/><line x1="673.6" y1="590.5" x2="684.8" y2="579.1" stroke="#081f3b" stroke-width="4" stroke-linecap="round"/><line x1="692.2" y1="608.9" x2="703.4" y2="597.5" stroke="#081f3b" stroke-width="4" stroke-linecap="round"/><line x1="710.8" y1="627.3" x2="722.0" y2="615.9" stroke="#081f3b" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- river -->
    <path d="M150 622 Q205 602 260 622 T370 622 T480 622 T590 622 T700 622 T810 622 T920 622 L920 900 L150 900 Z" fill="#1f7fc4"/>
    <path d="M150 680 Q205 662 260 680 T370 680 T480 680 T590 680 T700 680 T810 680 T920 680" fill="none" stroke="#6cc3f0" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <path d="M150 736 Q205 718 260 736 T370 736 T480 736 T590 736 T700 736 T810 736 T920 736" fill="none" stroke="#6cc3f0" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    <!-- the plastic bottle it is going for -->
    <g transform="translate(752 620) rotate(-18)">
      <rect x="-24" y="-11" width="44" height="22" rx="8" fill="#9be7ff"/>
      <rect x="18" y="-6" width="14" height="12" rx="3" fill="#9be7ff"/>
      <rect x="31" y="-7" width="6" height="14" rx="2" fill="#ff9933"/>
    </g>
  </g>
    <circle cx="500" cy="500" r="331" fill="none" stroke="#ffffff" stroke-width="8"/>
  </svg>
  <text class="n" x="620" y="262" font-size="184" fill="#081f3b" textLength="1700" lengthAdjust="spacing">NIRMAL DHARA JALYAN</text>
  <rect x="620" y="300" width="566" height="20" rx="10" fill="#ff9933"/>
  <rect x="1187" y="300" width="566" height="20" rx="10" fill="#ffffff" stroke="#081f3b" stroke-width="3"/>
  <rect x="1754" y="300" width="566" height="20" rx="10" fill="#138808"/>
  <text class="n" x="620" y="450" font-size="118" fill="#081f3b">निर्मल धारा जलयान</text>
  <text class="m" x="2320" y="530" font-size="58" letter-spacing="8" fill="#1f7fc4" text-anchor="end">VARUNA AI · RIVER CLEANUP BOAT</text>
</svg>