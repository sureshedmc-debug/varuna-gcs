<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VARUNA Live Training</title>
<style>
:root { --bg:#0d1420; --card:#151f2e; --line:#26354a; --text:#dbe6f3; --dim:#8aa0b8; --water:#123049; --shore:#3b5b3a;
        --boat:#f2f5f8; --bottle:#ffcc33; --seen:#4fc3f7; --weed:#3fa34d; --home:#e86a6a; --accent:#5ec2a0; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, Segoe UI, sans-serif; }
header { padding:14px 16px 6px; display:flex; flex-wrap:wrap; gap:8px 22px; align-items:baseline; }
h1 { font-size:18px; margin:0; }
.stat b { font-size:16px; } .stat { color:var(--dim); } .stat b { color:var(--text); }
#status { color:var(--accent); }
main { padding:8px 16px 20px; display:grid; gap:14px; }
.boats { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; }
.card canvas { width:100%; aspect-ratio:1; display:block; }
.cap { color:var(--dim); font-size:12px; margin-top:4px; display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap; }
.charts { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:10px; }
.charts canvas { width:100%; height:170px; display:block; }
.ct { font-size:13px; margin:0 0 4px; color:var(--dim); }
.legend { color:var(--dim); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
</style>
</head>
<body>
<header>
  <h1>VARUNA boat captain: live training</h1>
  <span class="stat">iteration <b id="it">-</b></span>
  <span class="stat">sim steps <b id="steps">-</b></span>
  <span class="stat">difficulty <b id="diff">-</b></span>
  <span class="stat">training time <b id="hrs">-</b></span>
  <span class="stat">speed <b id="sps">-</b> steps/s</span>
  <span id="status">connecting...</span>
</header>
<main>
  <div class="legend">
    <span><i style="background:var(--bottle)"></i>bottle</span><span><i style="background:var(--seen)"></i>camera memory</span>
    <span><i style="background:var(--weed)"></i>weed</span><span><i style="background:var(--home)"></i>home</span>
    <span>ramp: <b style="color:#5ec2a0">green = lowered</b> · white = up · <b style="color:#f39c4a">orange = tipping</b></span>
    <span>6 of 2048 boats, last 3.2 s of training replayed in real time</span>
  </div>
  <div class="boats" id="boats"></div>
  <div class="charts" id="charts"></div>
</main>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let live = null, t0 = performance.now(), rows = [];
const boatsEl = document.getElementById('boats');
const cards = [];
for (let i = 0; i < 6; i++) {
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = '<canvas></canvas><div class="cap"></div>';
  boatsEl.appendChild(c); cards.push({cv: c.querySelector('canvas'), cap: c.querySelector('.cap')});
}
const CH = [
  ['Bottles tipped into the bin per run', 'binned', 'eval_binned'],
  ['Bottles caught on the ramp per run', 'caught', null],
  ['Shore crashes per run (lower is better)', 'crash', 'eval_crash'],
  ['Got home at the end', 'home', 'eval_home'],
  ['Reward per run', 'ep_return', null],
  ['Difficulty (curriculum)', 'difficulty', null],
];
const chartsEl = document.getElementById('charts');
const charts = CH.map(([t]) => { const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<p class="ct">${t}</p><canvas></canvas>`; chartsEl.appendChild(d); return d.querySelector('canvas'); });

function fit(cv) { const r = cv.getBoundingClientRect(), k = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * k)) { cv.width = Math.round(r.width * k); cv.height = Math.round(r.height * k); }
  const g = cv.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); return [g, r.width, r.height]; }

function drawBoat(card, b, fi) {
  const [g, W, H] = fit(card.cv);
  let mn = [1e9, 1e9], mx = [-1e9, -1e9];
  for (const [n, e] of b.poly) { mn = [Math.min(mn[0], n), Math.min(mn[1], e)]; mx = [Math.max(mx[0], n), Math.max(mx[1], e)]; }
  const s = Math.min(W, H) / (Math.max(mx[0] - mn[0], mx[1] - mn[1]) * 1.08), cn = (mn[0] + mx[0]) / 2, ce = (mn[1] + mx[1]) / 2;
  const P = (n, e) => [W / 2 + (e - ce) * s, H / 2 - (n - cn) * s];   // north up, east right
  g.fillStyle = css('--shore'); g.fillRect(0, 0, W, H);
  g.beginPath(); b.poly.forEach(([n, e], i) => { const [x, y] = P(n, e); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.closePath(); g.fillStyle = css('--water'); g.fill();
  g.fillStyle = css('--weed'); g.globalAlpha = .55;
  for (const [n, e, r] of b.weeds) { const [x, y] = P(n, e); g.beginPath(); g.arc(x, y, r * s, 0, 7); g.fill(); }
  g.globalAlpha = 1;
  const [hx, hy] = P(...b.home); g.strokeStyle = css('--home'); g.lineWidth = 2; g.beginPath(); g.arc(hx, hy, 2 * s, 0, 7); g.stroke();
  g.fillStyle = css('--bottle');
  for (const [n, e] of b.bottles) { const [x, y] = P(n, e); g.beginPath(); g.arc(x, y, Math.max(2, .12 * s), 0, 7); g.fill(); }
  g.strokeStyle = css('--seen'); g.lineWidth = 1;
  for (const [n, e] of b.seen) { const [x, y] = P(n, e); g.beginPath(); g.arc(x, y, Math.max(4, .3 * s), 0, 7); g.stroke(); }
  const F = b.frames; if (!F.length) return;
  let start = 0; for (let i = 0; i <= fi; i++) if (F[i][6] && i < fi) start = i + 1;   // trail since the last reset
  g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 1.5; g.beginPath();
  for (let i = start; i <= fi; i++) { const [x, y] = P(F[i][0], F[i][1]); i === start ? g.moveTo(x, y) : g.lineTo(x, y); }
  g.stroke();
  const [n, e, psi, ramp, thr, steer] = F[fi];
  const [x, y] = P(n, e), L = Math.max(10, .6 * s), B = Math.max(7, .4 * s);
  g.save(); g.translate(x, y); g.rotate(psi);            // psi: 0 = north (up), clockwise
  g.fillStyle = css('--boat'); g.fillRect(-B / 2, -L / 2, B, L);
  g.fillStyle = ramp > .5 ? '#5ec2a0' : ramp < -.5 ? '#f39c4a' : '#cfd8e3';
  g.fillRect(-B / 2, -L / 2 - L * .45 * Math.max(.2, Math.abs(ramp)), B, L * .45 * Math.max(.2, Math.abs(ramp)));
  g.strokeStyle = '#ff7b54'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, L / 2); g.lineTo(-steer * B * .5, L / 2 + thr * L * .6); g.stroke();
  g.restore();
  card.cap.innerHTML = `<span>caught ${b.caught} · bin ${b.bin} · ramp ${b.ramp_load}</span><span>throttle ${(thr * 100) | 0}% · steer ${steer.toFixed(2)}</span><span>difficulty ${b.diff} · wind ${Math.hypot(...b.wind).toFixed(1)} m/s · t ${b.t}s</span>`;
}

function drawChart(cv, key, ekey) {
  const [g, W, H] = fit(cv); g.clearRect(0, 0, W, H);
  const xs = rows.map(r => +r.steps / 1e6), ys = rows.map(r => r[key] === '' ? NaN : +r[key]);
  const ev = ekey ? rows.filter(r => r[ekey] !== '').map(r => [+r.steps / 1e6, +r[ekey]]) : [];
  if (!xs.length) { g.fillStyle = css('--dim'); g.fillText('waiting for data...', 10, 20); return; }
  const all = ys.filter(isFinite).concat(ev.map(p => p[1]));
  let lo = Math.min(0, ...all), hi = Math.max(...all, lo + 1e-3); const pad = 28;
  const X = v => pad + (v - xs[0]) / Math.max(1e-9, xs[xs.length - 1] - xs[0]) * (W - pad - 8), Y = v => H - 18 - (v - lo) / (hi - lo) * (H - 26);
  g.strokeStyle = css('--line'); g.beginPath(); g.moveTo(pad, 4); g.lineTo(pad, H - 18); g.lineTo(W - 4, H - 18); g.stroke();
  g.fillStyle = css('--dim'); g.font = '11px system-ui';
  g.fillText(hi.toFixed(hi < 10 ? 2 : 0), 2, 12); g.fillText(lo.toFixed(lo > -10 ? 1 : 0), 2, H - 20);
  g.fillText(xs[xs.length - 1].toFixed(0) + ' M steps', W - 70, H - 4);
  g.strokeStyle = css('--accent'); g.lineWidth = 1.6; g.beginPath(); let st = false;
  ys.forEach((v, i) => { if (!isFinite(v)) return; const x = X(xs[i]), y = Y(v); st ? g.lineTo(x, y) : g.moveTo(x, y); st = true; }); g.stroke();
  if (ev.length) { g.fillStyle = '#ffcc33'; for (const [a, b] of ev) { g.beginPath(); g.arc(X(a), Y(b), 3, 0, 7); g.fill(); }
    g.fillText('● test on unseen boats (full difficulty)', pad + 6, 12); }
}

async function poll() {
  try {
    const j = await (await fetch('runs/live.json?' + Date.now())).json();
    if (!live || j.it !== live.it) { live = j; t0 = performance.now(); }
    document.getElementById('it').textContent = j.it;
    document.getElementById('steps').textContent = (j.steps / 1e6).toFixed(1) + ' M';
    document.getElementById('diff').textContent = j.difficulty.toFixed(2);
    document.getElementById('hrs').textContent = (j.hours * 60).toFixed(0) + ' min';
    document.getElementById('sps').textContent = Math.round(j.sps).toLocaleString();
    document.getElementById('status').textContent = 'live';
  } catch (e) { document.getElementById('status').textContent = 'waiting for the trainer...'; }
}
async function pollLog() {
  try {
    const t = (await (await fetch('runs/log.csv?' + Date.now())).text()).trim().split('\n');
    const h = t[0].split(','); rows = t.slice(1).map(l => Object.fromEntries(l.split(',').map((v, i) => [h[i], v])));
    CH.forEach(([, k, e], i) => drawChart(charts[i], k, e));
  } catch (e) {}
}
let lastDraw = 0;
function frame(now) {
  if (live && !document.hidden && now - lastDraw >= 50) { lastDraw = now;   // 20 fps = the sim's own rate, spares the CPU for training const n = live.boats[0].frames.length, fi = Math.min(n - 1, Math.floor((performance.now() - t0) / 1000 / live.dt) % n);
    live.boats.slice(0, 6).forEach((b, i) => drawBoat(cards[i], b, fi)); }
  requestAnimationFrame(frame);
}
poll(); pollLog(); setInterval(poll, 1500); setInterval(pollLog, 8000); requestAnimationFrame(frame);
addEventListener('resize', () => CH.forEach(([, k, e], i) => drawChart(charts[i], k, e)));
</script>
</body>
</html>
