<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VARUNA Captain Sandbox</title>
<style>
:root { --bg:#0b111a; --panel:rgba(12,20,32,.84); --line:#2a3b52; --text:#e2ebf6; --dim:#8fa6bf; --accent:#76b900; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, Segoe UI, sans-serif; overflow:hidden; }
#view { position:fixed; inset:0; cursor:crosshair; }
.hud { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; backdrop-filter:blur(4px); }
#top { top:10px; left:10px; right:10px; display:flex; gap:4px 16px; flex-wrap:wrap; align-items:baseline; }
#top h1 { font-size:15px; margin:0; color:var(--accent); }
.s { color:var(--dim); } .s b { color:var(--text); }
#side { bottom:10px; left:10px; width:min(330px, calc(100% - 20px)); }
#side h2 { font-size:13px; margin:0 0 6px; }
.row { display:flex; justify-content:space-between; gap:12px; color:var(--dim); } .row b { color:var(--text); }
.bar { height:6px; background:#1d2a3b; border-radius:3px; overflow:hidden; margin:2px 0 6px; } .bar i { display:block; height:100%; background:var(--accent); }
#doing { font-size:14px; font-weight:600; color:#fff; margin-bottom:6px; }
#msg { color:#ffd479; margin-top:6px; min-height:1.4em; }
#btns { bottom:10px; right:10px; display:flex; flex-wrap:wrap; gap:6px; max-width:min(360px, calc(100% - 20px)); justify-content:flex-end; }
button { background:#18263a; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
button:hover { border-color:var(--accent); }
button.on { background:var(--accent); color:#0b111a; border-color:var(--accent); font-weight:600; }
#wait { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--dim); }
@media (max-width:640px) { #side { bottom:auto; top:92px; } }
</style>
</head>
<body>
<div id="view"></div>
<div id="wait">starting the sandbox... (is sandbox.py running?)</div>
<div class="hud" id="top">
  <h1>VARUNA · captain sandbox</h1>
  <span class="s">captain <b id="label">-</b></span>
  <span class="s">real time · <b>no training</b></span>
  <span class="s">click the water to drop a bottle</span>
</div>
<div class="hud" id="side">
  <div id="doing">-</div>
  <div class="row">throttle <b id="thr">-</b></div><div class="bar"><i id="thrb"></i></div>
  <div class="row">steer (fins) <b id="steer">-</b></div><div class="bar"><i id="steerb"></i></div>
  <div class="row">scoop <b id="ramp">-</b></div>
  <div class="row">on the scoop <b id="load">-</b> · in the bin <b id="bin">-</b></div>
  <div class="row">bottles in the pond <b id="left">-</b> · camera sees <b id="seen">-</b></div>
  <div class="row">collected since start <b id="binned">-</b> · bank hits <b id="crash">-</b></div>
  <div class="row">speed <b id="spd">-</b></div>
  <div id="msg"></div>
</div>
<div class="hud" id="btns">
  <button id="bTrained" class="on">Trained captain</button>
  <button id="bUntrained">Untrained (random)</button>
  <button id="bFollow">Follow boat</button>
  <button id="bTop">Top view</button>
  <button id="bRand">Drop 5 random</button>
  <button id="bClear">Clear pond</button>
  <button id="bHome">Boat home</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc4e4);
scene.fog = new THREE.Fog(0x9cc4e4, 80, 260);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 1000);
camera.position.set(0, 26, 22);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;
scene.add(new THREE.HemisphereLight(0xdfefff, 0x3a5a2a, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(40, 90, 30); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshLambertMaterial({color: 0x4f7a3a}));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.25; scene.add(ground);

// ---------- materials
const M = {
  water: new THREE.MeshPhongMaterial({color: 0x1d5a7a, shininess: 90, specular: 0x88bbdd, transparent: true, opacity: 0.92}),
  bank: new THREE.MeshLambertMaterial({color: 0x8a7652}),
  foam: new THREE.MeshLambertMaterial({color: 0xf3f3ee}),
  deck: new THREE.MeshLambertMaterial({color: 0x30353c}),
  ply: new THREE.MeshLambertMaterial({color: 0xc49a62}),
  motor: new THREE.MeshPhongMaterial({color: 0x222831, shininess: 60}),
  prop: new THREE.MeshLambertMaterial({color: 0x111111, transparent: true, opacity: 0.85}),
  fin: new THREE.MeshLambertMaterial({color: 0xe0e4ea}),
  mesh: new THREE.MeshLambertMaterial({color: 0x9aa3ad, wireframe: true}),
  rampFrame: new THREE.MeshLambertMaterial({color: 0x5ec2a0}),
  bottle: new THREE.MeshPhongMaterial({color: 0xbfe6ff, emissive: 0x1a3d55, transparent: true, opacity: 0.85, shininess: 100}),
  cap: new THREE.MeshLambertMaterial({color: 0x1f6fd1}),
  weed: new THREE.MeshLambertMaterial({color: 0x3d8b34, side: THREE.DoubleSide}),
  weedWater: new THREE.MeshLambertMaterial({color: 0x2f6a2c, transparent: true, opacity: 0.7}),
  home: new THREE.MeshLambertMaterial({color: 0xe0503c}),
  seen: new THREE.MeshBasicMaterial({color: 0x4fc3f7, transparent: true, opacity: 0.6}),
  trail: new THREE.LineBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.6}),
  label: new THREE.MeshBasicMaterial({color: 0x76b900}),
};

// ---------- the boat (real size: 0.60 x 0.40 m hull, 0.127 m tall, posts 0.30 m)
function box(w, h, d, m) { const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); g.castShadow = true; return g; }
function at(m, x, y, z) { m.position.set(x, y, z); return m; }
function makeBoat() {
  const b = new THREE.Group();          // forward = -z, right = +x
  const H = 0.127, draft = 0.0127;
  const hull = new THREE.Group(); hull.position.y = H / 2 - draft; b.add(hull);
  hull.add(at(box(0.40, H, 0.12, M.foam), 0, 0, -0.24));   // bow block
  hull.add(at(box(0.40, H, 0.20, M.foam), 0, 0, 0.20));    // stern block
  hull.add(at(box(0.06, H, 0.28, M.foam), -0.17, 0, -0.04));
  hull.add(at(box(0.06, H, 0.28, M.foam), 0.17, 0, -0.04));
  const bin = box(0.26, 0.02, 0.26, new THREE.MeshLambertMaterial({color: 0x24323f})); bin.position.set(0, -H / 2 + 0.02, -0.04); hull.add(bin);
  const deck = box(0.34, 0.03, 0.16, M.deck); deck.position.set(0, H / 2 + 0.015, 0.20); hull.add(deck);
  const props = [], fins = [];
  for (const s of [-1, 1]) {
    const post = box(0.03, 0.30, 0.03, M.ply); post.position.set(s * 0.11, H + 0.15, 0.22); hull.add(post);
    const mot = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.05, 14), M.motor);
    mot.rotation.x = Math.PI / 2; mot.position.set(s * 0.11, H + 0.30, 0.22); hull.add(mot);
    const prop = new THREE.Group(); prop.position.set(s * 0.11, H + 0.30, 0.255);
    for (let k = 0; k < 2; k++) { const bl = box(0.13, 0.016, 0.004, M.prop); bl.rotation.z = k * Math.PI / 2; prop.add(bl); }
    const disc = new THREE.Mesh(new THREE.CircleGeometry(0.065, 20), new THREE.MeshBasicMaterial({color: 0x333333, transparent: true, opacity: 0, side: THREE.DoubleSide}));
    prop.add(disc); prop.userData.disc = disc;
    hull.add(prop); props.push(prop);
    const fin = new THREE.Group(); fin.position.set(s * 0.11, H + 0.30, 0.30);
    const blade = box(0.004, 0.12, 0.09, M.fin); blade.position.z = 0.045; fin.add(blade);
    hull.add(fin); fins.push(fin);
  }
  // ramp: hinged on the bow rod, rectangular mesh tray with V-wings and brush tips
  const hinge = new THREE.Group(); hinge.position.set(0, H * 0.6, -0.30); hull.add(hinge);
  const tray = new THREE.Group(); hinge.add(tray);
  const meshPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.50, 6, 8), M.mesh);
  meshPlane.rotation.x = -Math.PI / 2; meshPlane.position.z = -0.25; tray.add(meshPlane);
  for (const s of [-1, 1]) {
    const rail = box(0.015, 0.04, 0.50, M.rampFrame); rail.position.set(s * 0.21, 0.015, -0.25); tray.add(rail);
    const wing = box(0.18, 0.04, 0.012, M.rampFrame); wing.position.set(s * 0.29, 0.015, -0.48); wing.rotation.y = s * 0.55; tray.add(wing);
    const brush = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 10), new THREE.MeshLambertMaterial({color: 0x2b2b2b}));
    brush.position.set(s * 0.37, 0.0, -0.54); tray.add(brush);
  }
  const lip = box(0.42, 0.015, 0.02, M.rampFrame); lip.position.set(0, 0, -0.50); tray.add(lip);
  b.userData = {props, fins, hinge, rampFrame: M.rampFrame.clone()};
  b.traverse(o => { if (o.material === M.rampFrame) o.material = b.userData.rampFrame; });
  // big floating marker so boats are findable from the overview
  const tag = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.7, 4), M.label); tag.rotation.x = Math.PI; tag.position.y = 2.2; b.add(tag); b.userData.tag = tag;
  return b;
}
function makeBottle() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.2, 12), M.bottle);
  body.rotation.z = Math.PI / 2; g.add(body);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.03, 0.05, 10), M.bottle); neck.rotation.z = -Math.PI / 2; neck.position.x = 0.12; g.add(neck);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.02, 10), M.cap); cap.rotation.z = Math.PI / 2; cap.position.x = 0.155; g.add(cap);
  g.position.y = 0.01; g.rotation.y = Math.random() * 6.28;
  return g;
}

// ---------- the pond (built once from the sim's shape)
const $ = id => document.getElementById(id);
function W(n, e) { return new THREE.Vector3(e, 0, -n); }          // north/east -> three
let pondKey = null, pond = null, boat = null, camCone = null;
function buildPond(s) {
  if (pond) scene.remove(pond);
  pond = new THREE.Group();
  const sh = new THREE.Shape(s.poly.map(([n, e]) => new THREE.Vector2(e, n)));
  const water = new THREE.Mesh(new THREE.ShapeGeometry(sh, 6), M.water);
  water.rotation.x = -Math.PI / 2; water.name = 'water'; pond.add(water);
  const pts = s.poly.map(([n, e]) => W(n, e)); pts.push(pts[0]);
  for (let k = 0; k < pts.length - 1; k++) {
    const a = pts[k], c = pts[k + 1], len = a.distanceTo(c);
    const bank = new THREE.Mesh(new THREE.BoxGeometry(len + 0.6, 0.5, 0.8), M.bank);
    bank.position.copy(a).add(c).multiplyScalar(0.5); bank.position.y = 0.05;
    bank.rotation.y = -Math.atan2(c.z - a.z, c.x - a.x); pond.add(bank);
  }
  const hp = W(...s.home);
  const dock = new THREE.Mesh(new THREE.TorusGeometry(2, 0.06, 6, 40), M.home); dock.rotation.x = Math.PI / 2; dock.position.set(hp.x, 0.05, hp.z); pond.add(dock);
  const flag = box(0.05, 1.6, 0.05, M.home); flag.position.set(hp.x, 0.8, hp.z); pond.add(flag);
  scene.add(pond);
  if (!boat) {
    boat = makeBoat(); boat.userData.tag.visible = false; scene.add(boat);
    // what the camera can see: a flat wedge in front of the boat
    const [fov, range] = s.cam, seg = 24, verts = [0, 0, 0];
    for (let k = 0; k <= seg; k++) { const a = -fov + 2 * fov * k / seg; verts.push(Math.sin(a) * range, 0, -Math.cos(a) * range); }
    const idx = []; for (let k = 1; k <= seg; k++) idx.push(0, k, k + 1);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3)); g.setIndex(idx);
    camCone = new THREE.Mesh(g, new THREE.MeshBasicMaterial({color: 0xfff3a0, transparent: true, opacity: 0.13, side: THREE.DoubleSide, depthWrite: false}));
    camCone.position.y = 0.02; boat.add(camCone);
  }
}
const bottles = [], rings = [];
function syncItems(s) {
  while (bottles.length < s.bottles.length) {
    const m = makeBottle();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.7, 8), new THREE.MeshBasicMaterial({color: 0xff7a1a}));
    pole.position.y = 0.35; m.add(pole);                     // orange marker so bottles show up from the top view
    const top = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 8), pole.material); top.position.y = 0.75; m.add(top);
    scene.add(m); bottles.push(m);
  }
  bottles.forEach((m, k) => { m.visible = k < s.bottles.length; if (m.visible) { const p = W(...s.bottles[k]); m.position.x = p.x; m.position.z = p.z; } });
  while (rings.length < s.seen.length) { const r = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.38, 24), M.seen); r.rotation.x = -Math.PI / 2; scene.add(r); rings.push(r); }
  rings.forEach((m, k) => { m.visible = k < s.seen.length; if (m.visible) { const p = W(...s.seen[k]); m.position.set(p.x, 0.02, p.z); } });
}

// ---------- trail
const TRAIL = 600, trailPts = new Float32Array(TRAIL * 3); let trailN = 0;
const trailGeo = new THREE.BufferGeometry(); trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPts, 3));
const trail = new THREE.Line(trailGeo, M.trail); scene.add(trail);
function addTrail(p) {
  if (trailN) { const i = (trailN - 1) * 3; if (Math.hypot(trailPts[i] - p.x, trailPts[i + 2] - p.z) < 0.15) return; }
  if (trailN === TRAIL) { trailPts.copyWithin(0, 3); trailN--; }
  trailPts.set([p.x, 0.03, p.z], trailN * 3); trailN++;
  trailGeo.setDrawRange(0, trailN); trailGeo.attributes.position.needsUpdate = true; trailGeo.computeBoundingSphere();
}

// ---------- data: poll the sim ~12x a second, draw slightly behind so motion is smooth
let A = null, B = null, tA = 0, tB = 0, lastK = -1;
async function poll() {
  try {
    const s = await (await fetch('/state', {cache: 'no-store'})).json();
    if (!s.k) return;
    $('wait').style.display = 'none';
    const key = JSON.stringify(s.poly[0]) + s.poly.length;
    if (key !== pondKey) { pondKey = key; buildPond(s); }
    if (s.k !== lastK) {
      if (B && s.k < lastK) { A = null; trailN = 0; }        // sandbox restarted
      lastK = s.k; A = B || s; tA = B ? tB : performance.now(); B = s; tB = performance.now();
      syncItems(s);
      if (Math.hypot(s.pos[0] - (A.pos[0]), s.pos[1] - A.pos[1]) > 3) trailN = 0;   // boat put back home
    }
    $('label').textContent = s.label;
    $('label').style.color = s.brain === 'untrained' ? '#ff8a65' : '';
    $('bTrained').classList.toggle('on', s.brain !== 'untrained');
    $('bUntrained').classList.toggle('on', s.brain === 'untrained');
    $('doing').textContent = s.doing[0].toUpperCase() + s.doing.slice(1);
    $('thr').textContent = Math.round(s.thr * 100) + '%'; $('thrb').style.width = Math.round(s.thr * 100) + '%';
    $('steer').textContent = (s.steer >= 0 ? 'right ' : 'left ') + Math.abs(s.steer).toFixed(2); $('steerb').style.width = Math.round(Math.abs(s.steer) * 100) + '%';
    $('ramp').textContent = s.ramp > 0.85 ? 'down: collecting' : s.ramp < -0.5 ? 'tipping into the bin' : s.ramp > 0.1 ? 'lowering' : 'up';
    $('load').textContent = s.ramp_load; $('bin').textContent = s.bin;
    $('left').textContent = s.bottles.length; $('seen').textContent = s.seen.length;
    $('binned').textContent = s.binned; $('crash').textContent = s.crashes;
    $('spd').textContent = s.u.toFixed(2) + ' m/s';
    $('msg').textContent = s.msg;
  } catch (e) { $('wait').style.display = ''; }
}
setInterval(poll, 80); poll();

async function send(cmd) {
  try { await fetch('/cmd', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(cmd)}); } catch (e) {}
}

// ---------- clicks: drop a bottle where the water was clicked (a drag only turns the camera)
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (e.button !== 0 || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const p = new THREE.Vector3();
  if (!ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), p)) return;
  send({do: 'bottle', n: -p.z, e: p.x});
  const ping = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.18, 24), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true}));
  ping.rotation.x = -Math.PI / 2; ping.position.set(p.x, 0.04, p.z); scene.add(ping); pings.push([ping, performance.now()]);
});
const pings = [];

// ---------- buttons
let follow = false;
$('bFollow').onclick = () => { follow = !follow; $('bFollow').classList.toggle('on', follow);
  if (follow && boat) { controls.target.copy(boat.position); camera.position.set(boat.position.x - 3, 3, boat.position.z + 4); } };
$('bTop').onclick = () => { follow = false; $('bFollow').classList.remove('on'); camera.position.set(0, 26, 22); controls.target.set(0, 0, 0); };
$('bTrained').onclick = () => { trailN = 0; send({do: 'brain', which: 'trained'}); };
$('bUntrained').onclick = () => { trailN = 0; send({do: 'brain', which: 'untrained'}); };
$('bRand').onclick = () => send({do: 'random', count: 5});
$('bClear').onclick = () => send({do: 'clear'});
$('bHome').onclick = () => send({do: 'home'});

// ---------- animation
const lerpA = (a, b, t) => { let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * t; };
let prev = null;
function animate(now) {
  requestAnimationFrame(animate);
  if (boat && A && B) {
    const span = Math.max(1, tB - tA), f = Math.min(1, (now - tB) / span + 0);   // glide from A to B over one poll gap
    const n = A.pos[0] + (B.pos[0] - A.pos[0]) * f, e = A.pos[1] + (B.pos[1] - A.pos[1]) * f;
    const psi = lerpA(A.psi, B.psi, f), ramp = A.ramp + (B.ramp - A.ramp) * f, thr = B.thr, steer = B.steer;
    const p = W(n, e);
    boat.position.set(p.x, Math.sin(now / 420) * 0.006, p.z);
    boat.rotation.set(Math.sin(now / 610) * 0.015 - thr * 0.03, -psi, Math.sin(now / 530) * 0.02);
    const ud = boat.userData;
    ud.props.forEach(pr => { pr.rotation.z += thr * 1.2 + 0.02; pr.userData.disc.material.opacity = Math.min(0.35, thr * 0.5); });
    ud.fins.forEach(fn => fn.rotation.y = -steer * 0.52);
    ud.hinge.rotation.x = ramp >= 0 ? (0.52 - ramp * 0.87) : (0.52 + (-ramp) * 1.7);
    ud.rampFrame.color.setHex(ramp > 0.5 ? 0x5ec2a0 : ramp < -0.5 ? 0xf39c4a : 0xcfd8e3);
    addTrail(boat.position);
    if (follow) {
      if (prev) { const d = boat.position.clone().sub(prev); d.y = 0; camera.position.add(d); controls.target.add(d); }
      prev = boat.position.clone();
    } else prev = null;
  }
  for (let i = pings.length - 1; i >= 0; i--) {
    const [m, t] = pings[i], age = (now - t) / 700;
    if (age >= 1) { scene.remove(m); pings.splice(i, 1); } else { m.scale.setScalar(1 + age * 4); m.material.opacity = 1 - age; }
  }
  controls.update();
  renderer.render(scene, camera);
}
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
