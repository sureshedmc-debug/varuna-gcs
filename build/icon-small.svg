<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 16–32 px version of icon.svg: the drone's detail is lost at this size,
       so it keeps only the tile, the drop and the wave. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="0.55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="dropClip">
      <path d="M32 6 C38 15 49 25 49 37 A17 17 0 1 1 15 37 C15 25 26 15 32 6 Z"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)"/>
  <path fill="#ffffff" d="M32 6 C38 15 49 25 49 37 A17 17 0 1 1 15 37 C15 25 26 15 32 6 Z"/>
  <g clip-path="url(#dropClip)">
    <path fill="url(#wave)" d="M12 42 Q18 38.5 24 42 T36 42 T48 42 T60 42 V60 H12 Z"/>
  </g>
  <circle cx="32" cy="31" r="5" fill="#5b21b6"/>
  <circle cx="32" cy="31" r="2" fill="#22d3ee"/>
</svg>
