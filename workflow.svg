  <text x="416.40274999999997" y="143.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">plastic_bottle.onnx</text>
</g>
<g class="node" data-id="Fusion" data-label="Detection Fusion &amp; NMS" data-shape="rectangle">
  <rect x="245.21974999999998" y="278.1" width="181.25799999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
