<polyline class="edge" data-from="B" data-to="Fusion" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="High-precision bottle identification" points="416.40274999999997,161.8 416.40274999999997,266.1 366.05841666666663,266.1 366.05841666666663,278.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Fusion" data-to="Out1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="335.84875,315 335.84875,339 184.3515,339 184.3515,363" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
