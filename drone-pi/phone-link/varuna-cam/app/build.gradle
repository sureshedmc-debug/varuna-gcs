// VARUNA Cam: streams the phone's camera as MJPEG on port 8080 (http://<phone>:8080/video)
// for the VARUNA drone backend, over NetBird. Build:  gradlew assembleDebug
plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.varuna.cam'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.varuna.cam'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '2.6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}
